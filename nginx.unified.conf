# Single-container deployment (Dockerfile / Coolify) - proxies to localhost:8000
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Security headers for static files (API headers are set by FastAPI middleware).
    # CSP mirrors middleware/security.py: Google Sign-In + Picker + Dropbox
    # Chooser scripts, no CDNs. It must be on the HTML shell, not just /api/*.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com https://www.dropbox.com https://cdn01.boxcdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://cdn01.boxcdn.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.openai.com https://api.anthropic.com https://login.microsoftonline.com https://accounts.google.com https://apis.google.com https://www.googleapis.com https://api.box.com https://upload.box.com; frame-src 'self' blob: https://accounts.google.com https://docs.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Ignored by browsers on plain HTTP; effective once TLS is in front (Coolify/Traefik/Caddy).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend - serve static files
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API - proxy to Python backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Must exceed the strategy case-law stage budget
        # (CASE_LAW_TIME_BUDGET_SECONDS in backend/app/services/strategy.py)
        # plus synthesis time — full-opinion reading is slow by design.
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # Ready check endpoint
    location /ready {
        proxy_pass http://127.0.0.1:8000/ready;
    }

    # Metrics endpoint
    location /metrics {
        proxy_pass http://127.0.0.1:8000/metrics;
    }

    # Larger file uploads
    client_max_body_size 100M;

    # Disable server version exposure
    server_tokens off;
}
