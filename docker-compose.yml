# Single-app deployment behind a platform proxy (Coolify/Traefik/nginx).
# Configure external PostgreSQL and Redis URLs in .env and persist /app/data.
services:
  app:
    image: ${CASECITE_IMAGE:-ghcr.io/thomasunise/casecite}:${CASECITE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
      VECTOR_DB: ${VECTOR_DB:-chroma}
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads
      BACKUP_ENCRYPTION_KEY: ""
    volumes:
      - casecite_data:/app/data
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  casecite_data:
    driver: local
