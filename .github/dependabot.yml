# Dependabot opens version-bump PRs (a few at a time) for each ecosystem and
# reports advisories in the repo's Security tab. Every PR goes through the
# same CI as any other change: pip-audit against requirements.lock, npm audit
# on production dependencies, and Trivy on the built image all fail the build
# on known vulnerabilities.
#
# Note for the pip ecosystem: backend/requirements.lock is generated with
# `uv pip compile` (see the header of that file). After merging a bump to
# requirements.txt, regenerate the lock.
version: 2
updates:
  # Python backend dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Frontend (npm) dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions (workflows pin actions by commit SHA; this bumps the pins)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Every codeql-action step in a workflow must run the same version, or
      # analyze refuses the configuration init wrote; bump them together.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Base images in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # The Docker image is built only on pushes to main, so a base-image PR is
    # never built before merge. Runtime moves are made by hand instead:
    ignore:
      # A new Python minor needs requirements.lock regenerated for it
      # (`--python-version`) and CI's PYTHON_VERSION moved in step.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Odd-numbered Node majors are never LTS; move between LTS lines by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
