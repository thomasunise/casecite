# Alembic Configuration for CaseCite
#
# This file configures Alembic database migrations.
# Production: Set DATABASE_URL environment variable
# Development: Uses SQLite by default

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Truncate long revision names
truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Version path separator
# version_path_separator = os
# version_path_separator = space

# Set to 'true' to search source files recursively
# in each "version_locations" directory
# recursive_version_locations = false

# Database URL - this will be overridden by env.py from environment variable
# sqlalchemy.url is not set here - it's loaded from DATABASE_URL in env.py

# Prepend 'model.' to message in autogenerated migrations
# prepend_sys_path = .

# Timezone used by the file_template
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to delete source files
# after they are compiled to .pyc or .pyo files
# remove_dropped_files = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
